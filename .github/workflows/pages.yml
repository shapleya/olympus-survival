name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Stage and cache-bust
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          VERSION="${GITHUB_SHA::12}"
          echo "Asset version: ${VERSION}"
          sed -i -E "s#(href=\"styles\.css)(\")#\1?v=${VERSION}\2#g" _site/index.html
          sed -i -E "s#(src=\"js/[^\"]+\.js)(\")#\1?v=${VERSION}\2#g" _site/index.html
          grep -q "styles.css?v=${VERSION}" _site/index.html
          grep -q "js/data.js?v=${VERSION}" _site/index.html
          grep -E '(src|href)="[^"]+\?v=' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
